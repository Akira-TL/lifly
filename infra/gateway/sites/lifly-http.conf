# Lifly HTTP entrypoint.
# Keeps ACME HTTP-01 available and redirects all application traffic to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name lifly.babelbeast.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
