services:
  postgres:
    image: postgres:16
    container_name: lifecore-postgres
    environment:
      POSTGRES_USER: lifecore
      POSTGRES_PASSWORD: lifecore
      POSTGRES_DB: lifecore
    ports:
      - "8332:5432"
    volumes:
      - lifecore_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: lifecore-redis
    ports:
      - "8379:6379"

  minio:
    image: minio/minio:latest
    container_name: lifecore-minio
    command: server /data --console-address ":8301"
    environment:
      MINIO_ROOT_USER: lifecore
      MINIO_ROOT_PASSWORD: lifecore-secret
    ports:
      - "8300:9000"
      - "8301:9001"
    volumes:
      - lifecore_minio:/data

  powersync:
    image: powersync/powersync-service:latest
    container_name: lifecore-powersync
    profiles: ["powersync"]
    ports:
      - "8380:8080"
    environment:
      POWERSYNC_CONFIG_PATH: /config/powersync.yaml
    volumes:
      - ./powersync:/config

volumes:
  lifecore_postgres:
  lifecore_minio:
