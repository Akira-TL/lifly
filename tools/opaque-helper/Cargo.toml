[package]
name = "lifly-opaque-helper"
version = "0.9.0"
edition = "2021"
rust-version = "1.87"
publish = false

[dependencies]
anyhow = "1.0"
argon2 = "0.5"
base64 = "0.22"
opaque-ke = { version = "4.0.1", features = ["argon2", "ristretto255"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.20"
