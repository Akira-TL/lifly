# Lifly public HTTPS gateway.
# Public surface:
#   /          -> Flutter Web release static bundle
#   /api/*     -> FastAPI     (127.0.0.1:8210)
#   /mcp[/...] -> Cloud MCP   (127.0.0.1:8210)
# PowerSync is exposed only through the authenticated same-origin /powersync/ proxy.
# PostgreSQL/Redis/MinIO remain private host-local services.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lifly.babelbeast.com;

    ssl_certificate     /etc/letsencrypt/live/lifly.babelbeast.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lifly.babelbeast.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 32m;

    # FastAPI REST API. No trailing slash on proxy_pass: preserve /api/... exactly.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # PowerSync public sync endpoint. The trailing slash on proxy_pass strips
    # the /powersync/ prefix before forwarding to the host-local service.
    location ^~ /powersync/ {
        proxy_pass http://127.0.0.1:8204/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # MCP Streamable HTTP may keep responses open; disable response buffering.
    location = /mcp {
        proxy_pass http://127.0.0.1:8210;
        proxy_http_version 1.1;
        # FastMCP validates Host; present the local upstream identity and retain
        # the public host in X-Forwarded-Host instead of weakening Host checks.
        proxy_set_header Host 127.0.0.1:8210;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /mcp/ {
        proxy_pass http://127.0.0.1:8210;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8210;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Roadshow/public Web must use a release bundle. Serving Flutter's debug
    # web-server behind Nginx breaks DWDS WebSockets and is not a deployable UI.
    location = /index.html {
        root /home/Akira/Projects/lifly/apps/client_flutter/build/web;
        add_header Cache-Control "no-store" always;
    }

    location / {
        root /home/Akira/Projects/lifly/apps/client_flutter/build/web;
        try_files $uri $uri/ /index.html;
    }
}
