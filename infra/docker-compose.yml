services:
  postgres:
    image: postgres:16
    container_name: lifly-postgres
    environment:
      POSTGRES_USER: lifly
      POSTGRES_PASSWORD: lifly
      POSTGRES_DB: lifly
    ports:
      - "8332:5432"
    volumes:
      - lifly_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: lifly-redis
    ports:
      - "8379:6379"

  minio:
    image: minio/minio:latest
    container_name: lifly-minio
    command: server /data --console-address ":8301"
    environment:
      MINIO_ROOT_USER: lifly
      MINIO_ROOT_PASSWORD: lifly-secret
    ports:
      - "8300:9000"
      - "8301:9001"
    volumes:
      - lifly_minio:/data

  powersync:
    image: powersync/powersync-service:latest
    container_name: lifly-powersync
    profiles: ["powersync"]
    ports:
      - "8380:8080"
    environment:
      POWERSYNC_CONFIG_PATH: /config/powersync.yaml
    volumes:
      - ./powersync:/config

volumes:
  lifly_postgres:
  lifly_minio:
